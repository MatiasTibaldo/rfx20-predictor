  # contra el API histórico de MatbaRofex (/api/rfx20/historical) que el
  # error está en el origen, no en nuestra ingesta. Fix = recálculo
  # Σ(quantity × close_corregido) con quantity original (correcta) y
  # close tomado del OHLCV canónico (BYMA y YPFD reescalados x100/x10 para
  # quedar en la misma base nominal que el resto de la serie de
  # composición — ver composition_price_corrections más abajo).
