# Precios de close corrompidos en rfx20_composition.parquet (fuente:
# cartera_historica_201909{23..27}.csv) para los 20 componentes del índice,
# 2019-09-23 -> 2019-09-27. Confirmado contra el API histórico de MatbaRofex:
# el error está en el origen (mismo valor reportado por /api/rfx20/historical),
# no es un bug de ingesta. quantity NO está afectado (coincide con el API).
# Fix = close del OHLCV canónico (data/raw/v1/*_ohlcv.parquet) para el mismo
# ticker/fecha; BYMA y YPFD reescalados x100 y x10 respectivamente porque su
# OHLCV ya viene retroajustado por splits futuros (ver docs/decisions/
